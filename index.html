.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}

.tap{cursor:pointer}
.mu{color:var(--mu);font-size:13px}

.b.r{background:var(--rd)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

nav a.on{color:var(--pr);font-weight:700;box-shadow:inset 0 3px 0 var(--yk)}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--cd);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sh label{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}
.sh input:not([type=checkbox]),.sh select{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.sh input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-inline-end:8px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bd)}
.tag.on{background:var(--yk);color:#2b2100}
.ft{text-align:center;padding:16px 0 4px;font-size:12px}.ft a{color:var(--mu);text-decoration:none}
.tag.age{background:var(--pr);color:#fff}
.sh small{display:block;margin-top:2px}
.sh textarea{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.dt{cursor:pointer}
.pk{z-index:20;align-items:center;justify-content:center}.pk .sh{width:min(340px,92vw);border-radius:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:10px 0}
.cal span{font-size:12px;color:var(--mu)}
.cal button{border:0;background:transparent;color:var(--tx);font:inherit;padding:9px 0;border-radius:8px}
.cal button.sel{background:var(--pr);color:#fff}.cal button.td{box-shadow:inset 0 0 0 1px var(--yk)}
.ps{display:flex;gap:6px;align-items:center}.ps select{flex:1;margin:0!important}

function g2j(gy,gm,gd){const t=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gm>2?gy+1:gy;let d=355666+365*gy+~~((jy+3)/4)-~~((jy+99)/100)+~~((jy+399)/400)+gd+t[gm-1];jy=-1595+33*~~(d/12053);d%=12053;jy+=4*~~(d/1461);d%=1461;if(d>365){jy+=~~((d-1)/365);d=(d-1)%365}const jm=d<186?1+~~(d/31):7+~~((d-186)/30);const jd=1+(d<186?d%31:(d-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let d=-355668+365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(d/146097);d%=146097;if(d>36524){gy+=100*~~(--d/36524);d%=36524;if(d>=365)d++}gy+=4*~~(d/1461);d%=1461;if(d>365){gy+=~~((d-1)/365);d=(d-1)%365}let gd=d+1;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}

const q=(s,p=[])=>{const st=db.prepare(s);st.bind(p);const r=[];while(st.step())r.push(st.getAsObject());st.free();return r};
const run=(s,p=[])=>{db.run(s,p);save()};
const SCHEMA=`
CREATE TABLE IF NOT EXISTS farmers(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,phone TEXT);
CREATE TABLE IF NOT EXISTS halls(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,address TEXT,capacity INTEGER NOT NULL,
 bird_type TEXT NOT NULL CHECK(bird_type IN('broiler','layer')),owner_name TEXT,farmer_id INTEGER NOT NULL REFERENCES farmers(id),
 contract_start TEXT NOT NULL,contract_end TEXT,charge_first INTEGER NOT NULL DEFAULT 1,charge_last INTEGER NOT NULL DEFAULT 1);
CREATE TABLE IF NOT EXISTS cycles(id INTEGER PRIMARY KEY AUTOINCREMENT,hall_id INTEGER NOT NULL REFERENCES halls(id),placement_date TEXT NOT NULL,loading_date TEXT);
CREATE TABLE IF NOT EXISTS tariffs(id INTEGER PRIMARY KEY AUTOINCREMENT,bird_type TEXT NOT NULL,price_per_bird INTEGER NOT NULL,effective_from TEXT NOT NULL);
CREATE TABLE IF NOT EXISTS transactions(id INTEGER PRIMARY KEY AUTOINCREMENT,farmer_id INTEGER NOT NULL REFERENCES farmers(id),hall_id INTEGER REFERENCES halls(id),
 type TEXT NOT NULL CHECK(type IN('charge','debt','payment')),amount INTEGER NOT NULL,month_key TEXT,date TEXT NOT NULL,note TEXT);
CREATE TABLE IF NOT EXISTS placements(id INTEGER PRIMARY KEY AUTOINCREMENT,cycle_id INTEGER NOT NULL REFERENCES cycles(id),date TEXT NOT NULL,cnt INTEGER NOT NULL DEFAULT 0);
CREATE TABLE IF NOT EXISTS loadings(id INTEGER PRIMARY KEY AUTOINCREMENT,cycle_id INTEGER NOT NULL REFERENCES cycles(id),date TEXT NOT NULL,cnt INTEGER NOT NULL DEFAULT 0);
CREATE TABLE IF NOT EXISTS settings(k TEXT PRIMARY KEY,v TEXT);
CREATE TABLE IF NOT EXISTS visits(id INTEGER PRIMARY KEY AUTOINCREMENT,cycle_id INTEGER NOT NULL REFERENCES cycles(id),kind TEXT NOT NULL,title TEXT,date TEXT NOT NULL,cost INTEGER NOT NULL DEFAULT 0,notes TEXT,revisit INTEGER NOT NULL DEFAULT 0);
CREATE TABLE IF NOT EXISTS steps(cycle_id INTEGER NOT NULL,k TEXT NOT NULL,date TEXT NOT NULL,PRIMARY KEY(cycle_id,k));
CREATE TABLE IF NOT EXISTS feeds(id INTEGER PRIMARY KEY AUTOINCREMENT,cycle_id INTEGER NOT NULL REFERENCES cycles(id),date TEXT NOT NULL,done INTEGER NOT NULL DEFAULT 1,note TEXT);
CREATE UNIQUE INDEX IF NOT EXISTS uq_charge ON transactions(hall_id,month_key) WHERE type='charge';`;

function charges(){

 q('select * from halls').forEach(h=>{
  let s=h.contract_start.slice(0,7);if(!h.charge_first)s=nextM(s);
  let e=cur;
  if(h.contract_end){let x=h.contract_end.slice(0,7);if(!h.charge_last)x=prevM(x);if(x<e)e=x}
  for(let m=s;m<=e;m=nextM(m)){
   const t=q('select price_per_bird p from tariffs where bird_type=? and effective_from<=? order by effective_from desc limit 1',[h.bird_type,m])[0];

   db.run("insert or ignore into transactions(farmer_id,hall_id,type,amount,month_key,date,note) values(?,?,'charge',?,?,?,?)",[h.farmer_id,h.id,h.capacity*t.p,m,today(),'هزینه ماهانه پروانه '+m]);
  }
 });

}

const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fa=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false});
function mlen(y,m){if(m<7)return 31;if(m<12)return 30;const g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);return j[0]===y&&j[1]===12&&j[2]===30?30:29}
function pick(inp){
 const sel=normDate(inp.value),td=today();
 let[y,m]=(sel||td).split('-').map(Number);
 const o=document.createElement('div');o.className='mo pk';
 const draw=()=>{
  const g=j2g(y,m,1),off=(new Date(g[0],g[1]-1,g[2]).getDay()+1)%7,n=mlen(y,m);
  let c='';for(let i=0;i<off;i++)c+='<span></span>';
  for(let i=1;i<=n;i++){const k=y+'-'+p2(m)+'-'+p2(i);c+='<button type="button" data-d="'+i+'" class="'+(k===sel?'sel':k===td?'td':'')+'">'+fa(i)+'</button>'}
  let ys='';for(let v=y-8;v<=y+8;v++)ys+='<option value="'+v+'"'+(v===y?' selected':'')+'>'+fa(v)+'</option>';
  o.innerHTML='<div class="sh"><div class="ps"><button type="button" class="b g" data-s="-1">›</button><select data-m>'+MN.map((x,i)=>'<option value="'+(i+1)+'"'+(i+1===m?' selected':'')+'>'+x+'</option>').join('')+'</select><select data-y>'+ys+'</select><button type="button" class="b g" data-s="1">‹</button></div><div class="cal">'+['ش','ی','د','س','چ','پ','ج'].map(x=>'<span>'+x+'</span>').join('')+c+'</div><div class="rw"><button type="button" class="b g" data-t="1">امروز</button><button type="button" class="b g" data-c="1">پاک کردن</button><button type="button" class="b g" data-x="1">بستن</button></div></div>';
 };
 o.onchange=e=>{const t=e.target;if('m' in t.dataset)m=+t.value;else if('y' in t.dataset)y=+t.value;draw()};
 o.onclick=e=>{
  if(e.target===o){o.remove();return}
  const t=e.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.s){m+=+D.s;if(m>12){m=1;y++}if(m<1){m=12;y--}draw()}
  else if(D.d){inp.value=y+'/'+p2(m)+'/'+p2(D.d);o.remove()}
  else if(D.t){inp.value=td.replace(/-/g,'/');o.remove()}
  else if(D.c){inp.value='';o.remove()}
  else if(D.x){o.remove()}
 };
 draw();document.body.append(o);
}

/* ---------- مبلغ، پوشه، صورت‌حساب ---------- */
function w3(n){
 const o=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'],t=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'],
 d=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'],h=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
 const a=~~(n/100),b=n%100,r=[];
 if(a)r.push(h[a]);
 if(b>=10&&b<20)r.push(t[b-10]);else{if(b>=20)r.push(d[~~(b/10)]);if(b%10)r.push(o[b%10])}
 return r.join(' و ');
}
function words(n){
 if(!n)return '';

 +'<h2>مراحل سامانه‌ها</h2>'+STEPS.filter(s=>(bt==='layer')===s[0].includes('pullet')).map(s=>{const r=sp.find(x=>x.k===s[0]);return '<div class="cd rw tap" onclick="stepForm('+id+',\''+s[0]+'\')"><span>'+s[1]+'</span><span class="'+(r?'up':'mu')+'">'+(r?'✔ '+shown(r.date):'✘ انجام نشده')+'</span></div>'}).join('')
 +'<h2>تخلیه نهاده</h2><div class="acts"><button class="b" onclick="feedForm('+id+')">+ ثبت تخلیه نهاده</button></div>'
 +(fd.length?fd.map(f=>'<div class="cd tap" onclick="feedForm('+id+','+f.id+')"><div class="rw"><span>'+shown(f.date)+'</span><span class="'+(f.done?'up':'mu')+'">'+(f.done?'✔ ثبت شد':'✘ ثبت نشده')+' <a class="mu tap" onclick="event.stopPropagation();delFeed('+f.id+')">✕</a></span></div>'+(f.note?'<div class="mu" style="white-space:pre-wrap">'+esc(f.note)+'</div>':'')+'</div>').join(''):'<p class="mu">تخلیه‌ای ثبت نشده.</p>');
}
function visitForm(cid,vid){
 const v=vid?q('select * from visits where id=?',[vid])[0]:null;
 const hasTx=v?!!q('select 1 a from transactions where visit_id=?',[v.id])[0]:true;
 const bt=q('select h.bird_type b from halls h join cycles c on c.hall_id=h.id where c.id=?',[cid])[0].b,KL=vkFor(bt,v&&v.kind);
 form(v?'ویرایش بازدید':'ثبت بازدید',[
  {k:'kd',l:'نوع بازدید',t:'select',o:KL.map(x=>[x,x]),v:v?v.kind:KL[0]},
  {k:'nm',l:'اسم بازدید (فقط وقتی «سایر» رو انتخاب کردی)',v:v&&v.kind==='سایر'?v.title:''},
  {k:'d',l:'تاریخ بازدید',t:'d',v:v?v.date.replace(/-/g,'/'):today().replace(/-/g,'/'),req:1},
  {k:'c',l:'هزینه‌ی بازدید (تومان)',t:'n',v:v?v.cost:'',m:1},
  {k:'ad',l:'هزینه به بدهی مرغدار اضافه شود',t:'check',v:hasTx},
  {k:'rv',l:'نیاز به بازدید مجدد',t:'check',v:v?v.revisit:0},
  {k:'nt',l:'توضیحات و نواقص بازدید',t:'ta',v:v?v.notes:''}],o=>{
  if(o.kd==='سایر'&&!o.nm){alert('اسم بازدید رو بنویس');return}
  const title=o.kd==='سایر'?o.nm:o.kd,cost=o.c||0;
  let id=vid;
  if(vid)db.run('update visits set kind=?,title=?,date=?,cost=?,notes=?,revisit=? where id=?',[o.kd,title,o.d,cost,o.nt,o.rv?1:0,vid]);
  else{db.run('insert into visits(cycle_id,kind,title,date,cost,notes,revisit) values(?,?,?,?,?,?,?)',[cid,o.kd,title,o.d,cost,o.nt,o.rv?1:0]);id=q('select last_insert_rowid() r')[0].r}
  const ex=q('select id from transactions where visit_id=?',[id])[0];
  if(o.ad&&cost>0){
   if(ex)db.run('update transactions set amount=?,date=?,note=? where id=?',[cost,o.d,'بازدید '+title,ex.id]);
   else{const h=q('select h.id,h.farmer_id from halls h join cycles c on c.hall_id=h.id where c.id=?',[cid])[0];
    db.run("insert into transactions(farmer_id,hall_id,type,amount,date,note,cycle_id,visit_id) values(?,?,'debt',?,?,?,?,?)",[h.farmer_id,h.id,cost,o.d,'بازدید '+title,cid,id])}
  }else if(ex)db.run('delete from transactions where id=?',[ex.id]);
  save();render()});
}

/* ---------- لایسنس و تفکیک بازدیدها ---------- */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function licGate(){
 if(!LIC.required)return true;
 try{const s=JSON.parse(localStorage.getItem('lic')||'null');if(s&&LIC_H.includes(s.h))return true}catch(e){}
 licUI();return false;
}
function licUI(){
 const n=document.querySelector('nav');if(n)n.style.display='none';
 $('#app').innerHTML='<div class="cd"><h2>فعال‌سازی نرم‌افزار</h2><p class="mu">کد لایسنس رو وارد کن (۱۲ حرف و عدد).</p><input id="lk" style="display:block;width:100%;padding:12px;font:inherit;direction:ltr;text-align:center;letter-spacing:2px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px" placeholder="XXXX-XXXX-XXXX" autocomplete="off"><div class="acts"><button class="b" onclick="licGo()">فعال‌سازی</button></div><p id="lm" class="dn"></p></div>';
}
async function licGo(){
 const m=$('#lm');m.textContent='';
 const t=nd($('#lk').value).toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(t.length!==12){m.textContent='کد باید ۱۲ حرف و عدد باشه';return}
 let h;try{h=await sha(t)}catch(e){m.textContent='مرورگر از رمزنگاری پشتیبانی نمی‌کنه';return}
 if(!LIC_H.includes(h)){m.textContent='کد نامعتبر است';return}
 let dev=localStorage.getItem('dev');
 if(!dev){dev=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();localStorage.setItem('dev',dev)}
 if(LIC.server){
  try{
   const r=await fetch(LIC.server,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({h,d:dev})});
   const j=await r.json();if(!j.ok){m.textContent=j.reason||'رد شد';return}
  }catch(e){m.textContent='اتصال به سرور لایسنس برقرار نشد، اینترنت رو چک کن';return}
 }
 localStorage.setItem('lic',JSON.stringify({h}));location.reload();
}
const VKB=['جوجه‌ریزی','عقیم‌سازی کود گوشتی'],VKL=['پولت‌ریزی','عقیم‌سازی کود پولت','صدور گواهی سلامت پولت','صدور گواهی سلامت تخم‌گذار'],VKC=['نمونه‌گیری خون','نمونه‌برداری بافت','نمونه‌گیری سوآب'];
function vkFor(bt,cur){
 const l=[...(bt==='layer'?VKL:VKB),...VKC,'سایر'];
 if(cur&&!l.includes(cur))l.splice(l.length-1,0,cur);
 return l;
}
/* ---------- دوره پرورش ---------- */
function cyAge(cid){const d=q('select min(date) d from placements where cycle_id=?',[cid])[0].d;return d?dnum(today())-dnum(d):null}
function activeCycle(hid){return q('select * from cycles where hall_id=? and end_date is null order by placement_date desc limit 1',[hid])[0]}
function hallSt(h){if(h.contract_end)return '';const c=activeCycle(h.id);if(!c)return ' · خالی';const a=cyAge(c.id);return a==null?' · در حال پرورش':' · سن '+fa(a)+' روز'}
function cyTxt(c){if(c.end_date)return 'اعلام خاتمه: '+shown(c.end_date);const a=cyAge(c.id);return a==null?'':'سن '+fa(a)+' روز'}
const pc=(a,b)=>b?' ('+(a*100/b).toLocaleString('fa-IR',{maximumFractionDigits:1})+'٪)':'';
function syncCy(id){db.run('update cycles set placement_date=(select min(date) from placements where cycle_id=?) where id=? and exists(select 1 from placements where cycle_id=?)',[id,id,id])}
function vCycle(id){
 const c=q('select c.*,h.name hn from cycles c join halls h on h.id=c.hall_id where c.id=?',[id])[0];if(!c)return vHalls();
 const pl=q('select * from placements where cycle_id=? order by date',[id]);
 const ld=q('select * from loadings where cycle_id=? order by date',[id]);
 const s=cyStats(id),a=c.end_date?null:cyAge(id),lp=s.tot?s.losses*100/s.tot:0;
 const fee=q("select ifnull(sum(amount),0) s from transactions where cycle_id=? and type='debt' and visit_id is null",[id])[0].s;
 const yn=v=>v?'✔ ثبت شده':'✘ ثبت نشده';
 const R=[['کد مجوز جوجه‌ریزی',esc(c.license_code||'—')],['سن جوجه',a==null?'—':fa(a)+' روز'],['جمع جوجه ورودی',fmt(s.tot)+' قطعه'],
  ['تعداد تلفات','<span class="'+(lp>10?'dn':'')+'">'+fmt(s.losses)+(s.tot?' ('+lp.toLocaleString('fa-IR',{maximumFractionDigits:1})+'٪)':'')+'</span>'],
  ['قابل بارگیری',fmt(s.load)+' قطعه'],['بارگیری شده',fmt(s.loaded)+' قطعه'],['مانده در سالن',fmt(s.rem)+' قطعه'],
  ['بیماری‌ها',esc(c.diseases||'—')],['تلفات در سیستم',yn(c.loss_logged)],['واکسن در سیستم',yn(c.vaccine_logged)],
  ['هزینه سیستم',fee?fmt(fee)+' تومان':'—'],['پیش‌بینی بارگیری',shown(c.loading_date)],['شروع بارگیری',shown(s.lstart)],
  ['پایان بارگیری',s.loaded&&s.rem<=0?shown(s.lend):'—'],['اعلام خاتمه',shown(c.end_date)]];
 return '<a class="mu tap" onclick="go(\'hall\','+c.hall_id+')">› '+esc(c.hn)+'</a><h2>اطلاعات دوره</h2>'
 +'<div class="cd">'+R.map(r=>'<div class="rw"><span class="mu">'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+'</div>'
 +'<div class="acts"><button class="b" onclick="addPlacement('+id+')">+ ورود جوجه</button><button class="b" onclick="addLoading('+id+')">+ ثبت بارگیری</button><button class="b g" onclick="editCycle('+id+')">ویرایش دوره</button><button class="b r" onclick="delCycle('+id+')">حذف دوره</button></div>'
 +'<h2>ورود جوجه‌ها</h2>'+(pl.length?pl.map(p=>'<div class="cd rw"><span>'+shown(p.date)+'</span><span>'+fmt(p.cnt)+' قطعه <a class="mu tap" onclick="delPlacement('+p.id+')">✕</a></span></div>').join(''):'<p class="mu">ورودی ثبت نشده.</p>')
 +'<h2>بارگیری‌ها</h2>'+(ld.length?ld.map(p=>'<div class="cd rw"><span>'+shown(p.date)+'</span><span>'+fmt(p.cnt)+' قطعه <a class="mu tap" onclick="delLoading('+p.id+')">✕</a></span></div>').join(''):'<p class="mu">بارگیری ثبت نشده.</p>')+cySections(id);
}
