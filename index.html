<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5c3f">
<link rel="manifest" href="manifest.json">
<title>مدیریت مرغداری</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<style>
:root{--bg:#edf0e8;--cd:#fff;--tx:#17261d;--mu:#68746b;--pr:#1d5c3f;--yk:#f2b632;--rd:#b8372b;--gn:#1d7a4d;--bd:#d9dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#111713;--cd:#1a231d;--tx:#e6ede7;--mu:#92a095;--pr:#3fae7a;--yk:#f2b632;--rd:#ea6e60;--gn:#4ec08a;--bd:#2a362d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
#app{padding:14px;max-width:560px;margin:auto}
h2{margin:6px 0 12px;font-size:19px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tap{cursor:pointer}
.mu{color:var(--mu);font-size:13px}
.tot{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:16px;margin-bottom:12px}
.tot b{display:block;font-size:30px;line-height:1.3}
.tot small{opacity:.85}
.dn{color:var(--rd);font-weight:700}.up{color:var(--gn);font-weight:700}
.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
.b.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.b.r{background:var(--rd)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:12px 0;color:var(--mu);cursor:pointer}
nav a.on{color:var(--pr);font-weight:700;box-shadow:inset 0 3px 0 var(--yk)}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--cd);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sh label{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}
.sh input:not([type=checkbox]),.sh select{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.sh input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-inline-end:8px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bd)}
.tag.on{background:var(--yk);color:#2b2100}
.ft{text-align:center;padding:16px 0 4px;font-size:12px}.ft a{color:var(--mu);text-decoration:none}
.tag.age{background:var(--pr);color:#fff}
.dt{cursor:pointer}
.pk{z-index:20;align-items:center;justify-content:center}.pk .sh{width:min(340px,92vw);border-radius:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:10px 0}
.cal span{font-size:12px;color:var(--mu)}
.cal button{border:0;background:transparent;color:var(--tx);font:inherit;padding:9px 0;border-radius:8px}
.cal button.sel{background:var(--pr);color:#fff}.cal button.td{box-shadow:inset 0 0 0 1px var(--yk)}
.ps{display:flex;gap:6px;align-items:center}.ps select{flex:1;margin:0!important}
</style>
</head>
<body>
<div id="app"></div>
<nav><a id="n-farmers" onclick="go('farmers')">مرغداران</a><a id="n-halls" onclick="go('halls')">سالن‌ها</a><a id="n-set" onclick="go('set')">تنظیمات</a></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nd=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fmt=n=>Math.round(n||0).toLocaleString('fa-IR');
const p2=n=>String(n).padStart(2,'0');
const BT={broiler:'گوشتی',layer:'تخمگذار'};

/* ---------- تاریخ شمسی ---------- */
function g2j(gy,gm,gd){const t=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gm>2?gy+1:gy;let d=355666+365*gy+~~((jy+3)/4)-~~((jy+99)/100)+~~((jy+399)/400)+gd+t[gm-1];jy=-1595+33*~~(d/12053);d%=12053;jy+=4*~~(d/1461);d%=1461;if(d>365){jy+=~~((d-1)/365);d=(d-1)%365}const jm=d<186?1+~~(d/31):7+~~((d-186)/30);const jd=1+(d<186?d%31:(d-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let d=-355668+365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(d/146097);d%=146097;if(d>36524){gy+=100*~~(--d/36524);d%=36524;if(d>=365)d++}gy+=4*~~(d/1461);d%=1461;if(d>365){gy+=~~((d-1)/365);d=(d-1)%365}let gd=d+1;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
function today(){const d=new Date(),j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return j[0]+'-'+p2(j[1])+'-'+p2(j[2])}
function normDate(s){const a=nd(s).split(/[-\/.]/).map(Number);if(a.length!==3||a.some(isNaN))return '';return a[0]+'-'+p2(a[1])+'-'+p2(a[2])}
const nextM=m=>{let[y,k]=m.split('-').map(Number);if(++k>12){k=1;y++}return y+'-'+p2(k)};
const prevM=m=>{let[y,k]=m.split('-').map(Number);if(--k<1){k=12;y--}return y+'-'+p2(k)};
const dnum=s=>{const[y,m,d]=s.split('-').map(Number),g=j2g(y,m,d);return Date.UTC(g[0],g[1]-1,g[2])/864e5};
const shown=s=>s?s.replace(/-/g,'/'):'—';

/* ---------- دیتابیس SQLite (sql.js) ذخیره در IndexedDB ---------- */
let db,SQL;
const idb=(m,v)=>new Promise((res,rej)=>{const r=indexedDB.open('poultry',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onerror=rej;r.onsuccess=()=>{const st=r.result.transaction('s',m==='get'?'readonly':'readwrite').objectStore('s');const q=m==='get'?st.get('db'):st.put(v,'db');q.onsuccess=()=>res(q.result);q.onerror=rej}});
const save=()=>idb('put',db.export());
const q=(s,p=[])=>{const st=db.prepare(s);st.bind(p);const r=[];while(st.step())r.push(st.getAsObject());st.free();return r};
const run=(s,p=[])=>{db.run(s,p);save()};
const SCHEMA=`
CREATE TABLE IF NOT EXISTS farmers(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,phone TEXT);
CREATE TABLE IF NOT EXISTS halls(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,address TEXT,capacity INTEGER NOT NULL,
 bird_type TEXT NOT NULL CHECK(bird_type IN('broiler','layer')),owner_name TEXT,farmer_id INTEGER NOT NULL REFERENCES farmers(id),
 contract_start TEXT NOT NULL,contract_end TEXT,charge_first INTEGER NOT NULL DEFAULT 1,charge_last INTEGER NOT NULL DEFAULT 1);
CREATE TABLE IF NOT EXISTS cycles(id INTEGER PRIMARY KEY AUTOINCREMENT,hall_id INTEGER NOT NULL REFERENCES halls(id),placement_date TEXT NOT NULL,loading_date TEXT);
CREATE TABLE IF NOT EXISTS tariffs(id INTEGER PRIMARY KEY AUTOINCREMENT,bird_type TEXT NOT NULL,price_per_bird INTEGER NOT NULL,effective_from TEXT NOT NULL);
CREATE TABLE IF NOT EXISTS transactions(id INTEGER PRIMARY KEY AUTOINCREMENT,farmer_id INTEGER NOT NULL REFERENCES farmers(id),hall_id INTEGER REFERENCES halls(id),
 type TEXT NOT NULL CHECK(type IN('charge','debt','payment')),amount INTEGER NOT NULL,month_key TEXT,date TEXT NOT NULL,note TEXT);
CREATE TABLE IF NOT EXISTS placements(id INTEGER PRIMARY KEY AUTOINCREMENT,cycle_id INTEGER NOT NULL REFERENCES cycles(id),date TEXT NOT NULL,cnt INTEGER NOT NULL DEFAULT 0);
CREATE UNIQUE INDEX IF NOT EXISTS uq_charge ON transactions(hall_id,month_key) WHERE type='charge';`;

function col(t,c,d){if(!q('pragma table_info('+t+')').some(r=>r.name===c))db.run('alter table '+t+' add column '+c+' '+d)}
function initDb(){
 db.exec(SCHEMA);
 const first=!q('pragma table_info(cycles)').some(r=>r.name==='losses');
 [['loading_end','TEXT'],['end_date','TEXT'],['losses','INTEGER DEFAULT 0'],['diseases','TEXT'],['loss_logged','INTEGER DEFAULT 0'],['vaccine_logged','INTEGER DEFAULT 0'],['system_cost','INTEGER DEFAULT 0']].forEach(a=>col('cycles',a[0],a[1]));
 col('transactions','cycle_id','INTEGER');
 if(first)db.run('insert into placements(cycle_id,date,cnt) select id,placement_date,0 from cycles');
 save();
}
/* ---------- شارژ خودکار ماهانه ---------- */
function charges(){
 const cur=today().slice(0,7);
 q('select * from halls').forEach(h=>{
  let s=h.contract_start.slice(0,7);if(!h.charge_first)s=nextM(s);
  let e=cur;
  if(h.contract_end){let x=h.contract_end.slice(0,7);if(!h.charge_last)x=prevM(x);if(x<e)e=x}
  for(let m=s;m<=e;m=nextM(m)){
   const t=q('select price_per_bird p from tariffs where bird_type=? and effective_from<=? order by effective_from desc limit 1',[h.bird_type,m])[0];
   if(!t)continue;
   db.run("insert or ignore into transactions(farmer_id,hall_id,type,amount,month_key,date,note) values(?,?,'charge',?,?,?,?)",[h.farmer_id,h.id,h.capacity*t.p,m,today(),'شارژ '+m]);
  }
 });
 save();
}

/* ---------- تقویم شمسی ---------- */
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fa=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false});
function mlen(y,m){if(m<7)return 31;if(m<12)return 30;const g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);return j[0]===y&&j[1]===12&&j[2]===30?30:29}
function pick(inp){
 const sel=normDate(inp.value),td=today();
 let[y,m]=(sel||td).split('-').map(Number);
 const o=document.createElement('div');o.className='mo pk';
 const draw=()=>{
  const g=j2g(y,m,1),off=(new Date(g[0],g[1]-1,g[2]).getDay()+1)%7,n=mlen(y,m);
  let c='';for(let i=0;i<off;i++)c+='<span></span>';
  for(let i=1;i<=n;i++){const k=y+'-'+p2(m)+'-'+p2(i);c+='<button type="button" data-d="'+i+'" class="'+(k===sel?'sel':k===td?'td':'')+'">'+fa(i)+'</button>'}
  let ys='';for(let v=y-8;v<=y+8;v++)ys+='<option value="'+v+'"'+(v===y?' selected':'')+'>'+fa(v)+'</option>';
  o.innerHTML='<div class="sh"><div class="ps"><button type="button" class="b g" data-s="-1">›</button><select data-m>'+MN.map((x,i)=>'<option value="'+(i+1)+'"'+(i+1===m?' selected':'')+'>'+x+'</option>').join('')+'</select><select data-y>'+ys+'</select><button type="button" class="b g" data-s="1">‹</button></div><div class="cal">'+['ش','ی','د','س','چ','پ','ج'].map(x=>'<span>'+x+'</span>').join('')+c+'</div><div class="rw"><button type="button" class="b g" data-t="1">امروز</button><button type="button" class="b g" data-c="1">پاک کردن</button><button type="button" class="b g" data-x="1">بستن</button></div></div>';
 };
 o.onchange=e=>{const t=e.target;if('m' in t.dataset)m=+t.value;else if('y' in t.dataset)y=+t.value;draw()};
 o.onclick=e=>{
  if(e.target===o){o.remove();return}
  const t=e.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.s){m+=+D.s;if(m>12){m=1;y++}if(m<1){m=12;y--}draw()}
  else if(D.d){inp.value=y+'/'+p2(m)+'/'+p2(D.d);o.remove()}
  else if(D.t){inp.value=td.replace(/-/g,'/');o.remove()}
  else if(D.c){inp.value='';o.remove()}
  else if(D.x){o.remove()}
 };
 draw();document.body.append(o);
}
/* ---------- فرم ---------- */
function form(title,fields,ok){
 const m=document.createElement('div');m.className='mo';
 m.innerHTML='<form class="sh"><h2>'+title+'</h2>'+fields.map(f=>'<label>'+(f.t==='check'?'<input type="checkbox" name="'+f.k+'"'+(f.v?' checked':'')+'>'+f.l:f.l+(f.t==='select'?'<select name="'+f.k+'">'+f.o.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(f.v)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':f.t==='d'?'<input name="'+f.k+'" value="'+esc(f.v??'')+'" readonly class="dt" placeholder="انتخاب تاریخ" onclick="pick(this)">':'<input name="'+f.k+'" value="'+esc(f.v??'')+'" inputmode="'+(f.t==='n'?'numeric':'text')+'" autocomplete="off">'))+'</label>').join('')+'<div class="rw"><button class="b">ذخیره</button><button type="button" class="b g" onclick="this.closest(\'.mo\').remove()">انصراف</button></div></form>';
 m.querySelector('form').onsubmit=e=>{e.preventDefault();const o={};
  fields.forEach(f=>{const el=e.target.elements[f.k];o[f.k]=f.t==='check'?el.checked:f.t==='n'?+nd(el.value).replace(/[,٬\s]/g,''):f.t==='d'?normDate(el.value):el.value.trim()});
  for(const f of fields){if(f.req&&(!o[f.k]||(f.t==='n'&&isNaN(o[f.k])))){alert('«'+f.l+'» را درست وارد کن');return}}
  m.remove();ok(o)};
 document.body.append(m);
}

/* ---------- صفحه‌ها ---------- */
let V={t:'farmers'};
function go(t,id){V={t,id};render();scrollTo(0,0)}
const BAL=`sum(case when type='payment' then -amount else amount end)`;
const money=b=>'<b class="'+(b>0?'dn':'up')+'">'+fmt(b)+'</b>';

function vFarmers(){
 const bal={};q('select farmer_id f,'+BAL+' b from transactions group by farmer_id').forEach(r=>bal[r.f]=r.b);
 const fs=q('select * from farmers order by name');
 const tot=Object.values(bal).reduce((a,b)=>a+b,0);
 return '<div class="tot"><small>جمع کل بدهی مرغداران (تومان)</small><b>'+fmt(tot)+'</b></div>'
 +'<div class="acts"><button class="b" onclick="addFarmer()">+ مرغدار جدید</button></div>'
 +(fs.length?fs.map(f=>'<div class="cd rw tap" onclick="go(\'farmer\','+f.id+')"><span>'+esc(f.name)+'<br><span class="mu">'+esc(f.phone)+'</span></span>'+money(bal[f.id]||0)+'</div>').join(''):'<p class="mu">هنوز مرغداری ثبت نشده. اول یه مرغدار اضافه کن.</p>');
}
function vFarmer(id){
 const f=q('select * from farmers where id=?',[id])[0];if(!f)return vFarmers();
 const b=q('select '+BAL+' b from transactions where farmer_id=?',[id])[0].b||0;
 const hs=q('select * from halls where farmer_id=? order by contract_end is not null,name',[id]);
 const tx=q('select t.*,h.name hn from transactions t left join halls h on h.id=t.hall_id where t.farmer_id=? order by t.date desc,t.id desc',[id]);
 const L={charge:'شارژ',debt:'بدهی',payment:'پرداخت'};
 return '<a class="mu tap" onclick="go(\'farmers\')">› مرغداران</a><h2>'+esc(f.name)+'</h2>'
 +'<div class="tot"><small>مانده حساب (تومان)</small><b>'+fmt(b)+'</b></div>'
 +'<div class="acts"><button class="b" onclick="addTx('+id+',\'payment\')">ثبت پرداخت</button><button class="b g" onclick="addTx('+id+',\'debt\')">افزودن بدهی</button><button class="b g" onclick="addHall('+id+')">+ سالن</button><button class="b g" onclick="editFarmer('+id+')">ویرایش مرغدار</button></div>'
 +'<h2>سالن‌ها</h2>'+(hs.length?hs.map(h=>'<div class="cd rw tap" onclick="go(\'hall\','+h.id+')"><span>'+esc(h.name)+' <span class="mu">'+fmt(h.capacity)+' قطعه · '+BT[h.bird_type]+hallSt(h)+'</span></span><span class="tag'+(h.contract_end?'':' on')+'">'+(h.contract_end?'فسخ شده':'فعال')+'</span></div>').join(''):'<p class="mu">سالنی ثبت نشده.</p>')
 +'<h2>تاریخچه حساب</h2>'+tx.map(t=>'<div class="cd rw"><span>'+L[t.type]+(t.hn?' · '+esc(t.hn):'')+'<br><span class="mu">'+shown(t.date)+(t.note&&t.type!=='charge'?' · '+esc(t.note):'')+'</span></span><span>'+(t.type==='payment'?'<span class="up">−'+fmt(t.amount)+'</span>':'<span class="dn">'+fmt(t.amount)+'</span>')+(t.type!=='charge'?' <a class="mu tap" onclick="delTx('+t.id+')">✕</a>':'')+'</span></div>').join('');
}
function vHall(id){
 const h=q('select h.*,f.name fn from halls h join farmers f on f.id=h.farmer_id where h.id=?',[id])[0];if(!h)return vHalls();
 const cy=q('select * from cycles where hall_id=? order by placement_date desc',[id]);
 const ch=q(`select count(*) n,sum(amount) s from transactions where hall_id=? and type='charge'`,[id])[0];
 return '<a class="mu tap" onclick="go(\'farmer\','+h.farmer_id+')">› '+esc(h.fn)+'</a><h2>'+esc(h.name)+'</h2>'
 +'<div class="cd">'+[['آدرس',h.address],['ظرفیت',fmt(h.capacity)+' قطعه'],['نوع مرغ',BT[h.bird_type]],['مالک',h.owner_name],['شروع قرارداد',shown(h.contract_start)],['پایان قرارداد',shown(h.contract_end)],['جمع شارژها',fmt(ch.s)+' تومان ('+fmt(ch.n)+' ماه)']].map(r=>'<div class="rw"><span class="mu">'+r[0]+'</span><span>'+esc(r[1]||'—')+'</span></div>').join('')+'</div>'
 +'<div class="acts"><button class="b" onclick="addCycle('+id+')">+ دوره جدید</button><button class="b g" onclick="editHall('+id+')">ویرایش سالن</button>'+(h.contract_end?'':'<button class="b r" onclick="endHall('+id+')">فسخ قرارداد</button>')+'</div>'
 +'<h2>دوره‌ها</h2>'+(cy.length?cy.map(c=>'<div class="cd rw tap" onclick="go(\'cycle\','+c.id+')"><span>جوجه‌ریزی: '+shown(c.placement_date)+'</span><span class="mu">'+cyTxt(c)+'</span></div>').join(''):'<p class="mu">دوره‌ای ثبت نشده.</p>');
}
function vHalls(){
 const hs=q('select h.*,f.name fn from halls h join farmers f on f.id=h.farmer_id order by h.contract_end is not null,h.name');
 return '<div class="acts"><button class="b" onclick="addHall()">+ سالن جدید</button></div>'+(hs.length?hs.map(h=>{
  let t='';
  if(!h.contract_end){
   const c=activeCycle(h.id);
   if(!c)t='<span class="tag">خالی</span>';
   else{
    const a=cyAge(c.id);
    t='<span class="tag age">'+(a==null?'در حال پرورش':'سن '+fa(a)+' روز')+'</span>';
    if(c.loading_date){const d=dnum(c.loading_date)-dnum(today());t+=' <span class="mu">'+(d>0?fa(d)+' روز تا بارگیری':c.loading_end?'':'در حال بارگیری')+'</span>'}
   }
  }
  return '<div class="cd tap" onclick="go(\'hall\','+h.id+')"><div class="rw"><b>'+esc(h.name)+'</b><span class="tag'+(h.contract_end?'':' on')+'">'+(h.contract_end?'فسخ شده':'فعال')+'</span></div><div class="mu">'+esc(h.fn)+' · '+fmt(h.capacity)+' قطعه · '+BT[h.bird_type]+'</div>'+(t?'<div>'+t+'</div>':'')+'</div>'}).join(''):'<p class="mu">سالنی ثبت نشده.</p>');
}
function vSet(){
 const cur=t=>{const r=q('select * from tariffs where bird_type=? and effective_from<=? order by effective_from desc limit 1',[t,today().slice(0,7)])[0];return r?fmt(r.price_per_bird)+' تومان':'تعیین نشده'};
 return '<h2>تعرفه ماهانه هر قطعه</h2>'+['broiler','layer'].map(t=>'<div class="cd rw"><span>مرغ '+BT[t]+'<br><span class="mu">'+cur(t)+'</span></span><button class="b g" onclick="setTariff(\''+t+'\')">تغییر</button></div>').join('')
 +'<p class="mu">تعرفه جدید از ماه بعد اعمال میشه و ماه‌های قبل دست نمیخوره.</p>'
 +'<h2>پشتیبان‌گیری</h2><div class="acts"><button class="b g" onclick="exp()">دانلود فایل پشتیبان</button><button class="b g" onclick="$(\'#imp\').click()">بازیابی از فایل</button><input id="imp" type="file" hidden onchange="imp(this)"></div><div class="ft"><a href="https://t.me/aasgharae" target="_blank" rel="noopener">طراحی و اجرا: @aasgharae</a></div>';
}
function render(){
 ['farmers','halls','set'].forEach(k=>$('#n-'+k).classList.toggle('on',k===V.t||(k==='farmers'&&V.t==='farmer')||(k==='halls'&&(V.t==='hall'||V.t==='cycle'))));
 $('#app').innerHTML={farmers:vFarmers,farmer:()=>vFarmer(V.id),halls:vHalls,hall:()=>vHall(V.id),cycle:()=>vCycle(V.id),set:vSet}[V.t]();
}

function delTx(id){

/* ---------- دوره پرورش ---------- */
function cyAge(cid){const d=q('select min(date) d from placements where cycle_id=?',[cid])[0].d;return d?dnum(today())-dnum(d):null}
function activeCycle(hid){return q('select * from cycles where hall_id=? and end_date is null order by placement_date desc limit 1',[hid])[0]}
function hallSt(h){if(h.contract_end)return '';const c=activeCycle(h.id);if(!c)return ' · خالی';const a=cyAge(c.id);return a==null?' · در حال پرورش':' · سن '+fa(a)+' روز'}
function cyTxt(c){if(c.end_date)return 'خاتمه: '+shown(c.end_date);const a=cyAge(c.id);return a==null?'':'سن '+fa(a)+' روز'}
const pc=(a,b)=>b?' ('+(a*100/b).toLocaleString('fa-IR',{maximumFractionDigits:1})+'٪)':'';
function syncCy(id){db.run('update cycles set placement_date=(select min(date) from placements where cycle_id=?) where id=? and exists(select 1 from placements where cycle_id=?)',[id,id,id])}
function vCycle(id){
 const c=q('select c.*,h.name hn from cycles c join halls h on h.id=c.hall_id where c.id=?',[id])[0];if(!c)return vHalls();
 const pl=q('select * from placements where cycle_id=? order by date',[id]);
 const tot=pl.reduce((a,p)=>a+p.cnt,0),a=c.end_date?null:cyAge(id);
 const yn=v=>v?'✔ ثبت شده':'✘ ثبت نشده';
 const rows=[['سن جوجه',a==null?'—':fa(a)+' روز'],['جمع جوجه ورودی',fmt(tot)+' قطعه'],['تعداد تلفات',fmt(c.losses)+pc(c.losses,tot)],['بیماری‌ها',c.diseases],['تلفات در سیستم',yn(c.loss_logged)],['واکسن در سیستم',yn(c.vaccine_logged)],['هزینه سیستم',c.system_cost?fmt(c.system_cost)+' تومان':'—'],['شروع بارگیری',shown(c.loading_date)],['پایان بارگیری',shown(c.loading_end)],['خاتمه دوره',shown(c.end_date)]];
 return '<a class="mu tap" onclick="go(\'hall\','+c.hall_id+')">› '+esc(c.hn)+'</a><h2>اطلاعات دوره</h2>'
 +'<div class="cd">'+rows.map(r=>'<div class="rw"><span class="mu">'+r[0]+'</span><span>'+esc(r[1]||'—')+'</span></div>').join('')+'</div>'
 +'<div class="acts"><button class="b" onclick="addPlacement('+id+')">+ ورود جوجه</button><button class="b g" onclick="editCycle('+id+')">ویرایش دوره</button><button class="b r" onclick="delCycle('+id+')">حذف دوره</button></div>'
 +'<h2>ورود جوجه‌ها</h2>'+(pl.length?pl.map(p=>'<div class="cd rw"><span>'+shown(p.date)+'</span><span>'+fmt(p.cnt)+' قطعه <a class="mu tap" onclick="delPlacement('+p.id+')">✕</a></span></div>').join(''):'<p class="mu">ورودی ثبت نشده.</p>');
}
function addCycle(hid){
 form('دوره جدید',[{k:'d',l:'تاریخ ورود جوجه',t:'d',v:today().replace(/-/g,'/'),req:1},{k:'n',l:'تعداد جوجه ورودی',t:'n',req:1}],o=>{
  db.run('insert into cycles(hall_id,placement_date) values(?,?)',[hid,o.d]);
  const id=q('select last_insert_rowid() r')[0].r;
  db.run('insert into placements(cycle_id,date,cnt) values(?,?,?)',[id,o.d,o.n]);
  save();go('cycle',id)});
}
function addPlacement(cid){
 form('ورود جوجه',[{k:'d',l:'تاریخ ورود',t:'d',v:today().replace(/-/g,'/'),req:1},{k:'n',l:'تعداد جوجه',t:'n',req:1}],o=>{
  db.run('insert into placements(cycle_id,date,cnt) values(?,?,?)',[cid,o.d,o.n]);syncCy(cid);save();render()});
}
function delPlacement(id){
 if(!confirm('این ردیف حذف شود؟'))return;
 const c=q('select cycle_id c from placements where id=?',[id])[0].c;
 db.run('delete from placements where id=?',[id]);syncCy(c);save();render();
}
function editCycle(id){
 const c=q('select * from cycles where id=?',[id])[0],r=s=>(s||'').replace(/-/g,'/');
 form('ویرایش دوره',[
  {k:'sc',l:'هزینه سیستم (تومان، به بدهی مرغدار اضافه میشه)',t:'n',v:c.system_cost||0},
  {k:'ls',l:'تعداد تلفات',t:'n',v:c.losses||0},
  {k:'ds',l:'بیماری‌های دوره (با ویرگول جدا کن)',v:c.diseases},
  {k:'ll',l:'تلفات در سیستم ثبت شد',t:'check',v:c.loss_logged},
  {k:'vl',l:'واکسن در سیستم ثبت شد',t:'check',v:c.vaccine_logged},
  {k:'b1',l:'تاریخ شروع بارگیری',t:'d',v:r(c.loading_date)},
  {k:'b2',l:'تاریخ پایان بارگیری',t:'d',v:r(c.loading_end)},
  {k:'en',l:'تاریخ خاتمه دوره',t:'d',v:r(c.end_date)}],o=>{
  const sc=o.sc||0;
  db.run('update cycles set system_cost=?,losses=?,diseases=?,loss_logged=?,vaccine_logged=?,loading_date=?,loading_end=?,end_date=? where id=?',[sc,o.ls||0,o.ds,o.ll?1:0,o.vl?1:0,o.b1||null,o.b2||null,o.en||null,id]);
  const ex=q("select id from transactions where cycle_id=? and type='debt'",[id])[0];
  if(sc>0){
   if(ex)db.run('update transactions set amount=? where id=?',[sc,ex.id]);
   else{const h=q('select h.id,h.farmer_id from halls h join cycles c on c.hall_id=h.id where c.id=?',[id])[0];
    db.run("insert into transactions(farmer_id,hall_id,type,amount,date,note,cycle_id) values(?,?,'debt',?,?,?,?)",[h.farmer_id,h.id,sc,today(),'هزینه سیستم دوره',id])}
  }else if(ex)db.run('delete from transactions where id=?',[ex.id]);
  save();render()});
}
function delCycle(id){
 if(!confirm('کل این دوره حذف شود؟'))return;
 const h=q('select hall_id h from cycles where id=?',[id])[0].h;
 db.run('delete from placements where cycle_id=?',[id]);db.run('delete from transactions where cycle_id=?',[id]);db.run('delete from cycles where id=?',[id]);
 save();go('hall',h);
}
function endHall(id){
 form('فسخ قرارداد',[{k:'e',l:'تاریخ پایان',t:'d',v:today().replace(/-/g,'/'),req:1},{k:'cl',l:'ماه پایان هم محاسبه شود',t:'check',v:1}],o=>{
  const last=o.cl?o.e.slice(0,7):prevM(o.e.slice(0,7));
  db.run('update halls set contract_end=?,charge_last=? where id=?',[o.e,o.cl?1:0,id]);
  db.run(`delete from transactions where hall_id=? and type='charge' and month_key>?`,[id,last]);
  charges();render()});
}
function setTariff(t){
 form('تعرفه مرغ '+BT[t],[{k:'p',l:'تومان برای هر قطعه در ماه',t:'n',req:1}],o=>{
  const has=q('select count(*) n from tariffs where bird_type=?',[t])[0].n;
  const eff=has?nextM(today().slice(0,7)):'0000-00';
  db.run('delete from tariffs where bird_type=? and effective_from=?',[t,eff]);
  db.run('insert into tariffs(bird_type,price_per_bird,effective_from) values(?,?,?)',[t,o.p,eff]);
  charges();render()});
}

function imp(inp){const f=inp.files[0];if(!f||!confirm('اطلاعات فعلی با فایل جایگزین میشه. ادامه؟'))return;f.arrayBuffer().then(b=>{db=new SQL.Database(new Uint8Array(b));initDb();charges();render()})}

 navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
