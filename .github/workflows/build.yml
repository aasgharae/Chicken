name: Build APK and EXE

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          set -e
          test -f index.html || { echo "index.html تو ریشه ی ریپو نیست"; exit 1; }
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          cat > package.json <<'EOF'
          {"name":"poultry-android","version":"1.0.0","private":true}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"app.poultry.manager","appName":"مدیریت مرغداری","webDir":"www"}
          EOF
          npm install sql.js@1.8.0 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 --no-audit --no-fund
          cp node_modules/sql.js/dist/sql-asm.js www/sql-wasm.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/##g' www/index.html
          npx cap add android
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build EXE
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -e
          test -f index.html || { echo "index.html تو ریشه ی ریپو نیست"; exit 1; }
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          cat > package.json <<'EOF'
          {
            "name": "poultry-manager",
            "version": "1.0.0",
            "description": "Poultry farm manager",
            "main": "main.js",
            "scripts": { "dist": "electron-builder --win portable --publish never" },
            "build": {
              "appId": "app.poultry.manager",
              "productName": "Poultry Manager",
              "files": ["main.js", "preload.js", "www/**"],
              "directories": { "output": "dist" },
              "win": { "target": "portable" }
            }
          }
          EOF
          cat > main.js <<'EOF'
          const { app, BrowserWindow, ipcMain, shell } = require('electron');
          const path = require('path');
          const fs = require('fs');
          function dataDir() {
            const d = path.join(app.getPath('documents'), 'Poultry');
            fs.mkdirSync(d, { recursive: true });
            return d;
          }
          ipcMain.handle('save', (e, buf) => {
            fs.writeFileSync(path.join(dataDir(), 'poultry.sqlite'), Buffer.from(buf));
            return true;
          });
          ipcMain.handle('load', () => {
            const f = path.join(dataDir(), 'poultry.sqlite');
            return fs.existsSync(f) ? fs.readFileSync(f) : null;
          });
          app.whenReady().then(() => {
            const w = new BrowserWindow({
              width: 520, height: 900, autoHideMenuBar: true,
              webPreferences: { preload: path.join(__dirname, 'preload.js') }
            });
            w.webContents.setWindowOpenHandler(({ url }) => { shell.openExternal(url); return { action: 'deny' }; });
            w.loadFile(path.join(__dirname, 'www', 'index.html'));
          });
          app.on('window-all-closed', () => app.quit());
          EOF
          cat > preload.js <<'EOF'
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('electronAPI', {
            save: (b) => ipcRenderer.invoke('save', b),
            load: () => ipcRenderer.invoke('load')
          });
          EOF
          npm install sql.js@1.8.0 --no-audit --no-fund
          npm install --save-dev electron@31 electron-builder@24.13.3 --no-audit --no-fund
          cp node_modules/sql.js/dist/sql-asm.js www/sql-wasm.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/##g' www/index.html
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/dist/*.exe
